<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Profile - BCET Library</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
      margin: 0;
      padding: 0;
    }
    header {
      background: #3f51b5;
      color: #fff;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .profile-container {
      max-width: 450px;
      margin: 50px auto;
      background: #fff;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .profile-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #3f51b5;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #444;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      transition: border 0.3s;
    }
    input:focus, select:focus {
      border-color: #3f51b5;
      outline: none;
      box-shadow: 0 0 6px rgba(63,81,181,0.2);
    }
    .error {
      color: red;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .submit-btn {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #3f51b5;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .submit-btn:hover {
      background: #2c3e9d;
    }
  </style>
</head>
<body>

  <header>
    BCET Library - Teacher Profile
  </header>

  <div class="profile-container">
    <h2>Welcome Teacher</h2>
    <form id="teacherForm">
      <div class="form-group">
        <label for="id">Teacher ID:</label>
        <input type="text" name="id" id="id" placeholder="Enter your ID" required>
        <div class="error" id="idError">Please enter your Teacher ID</div>
      </div>
      
      <div class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" name="name" id="name" placeholder="Enter your name" required>
        <div class="error" id="nameError">Please enter your Name</div>
      </div>
      
      <div class="form-group">
        <label for="department">Department:</label>
        <select name="department" id="department" required>
          <option value="">-- Select Department --</option>
          <option value="CSE">CSE</option>
          <option value="IT">IT</option>
          <option value="ECE">ECE</option>
          <option value="CS">CS</option>
          <option value="ME">ME</option>
          <option value="CIVIL">CIVIL</option>
          <option value="MBA">MBA</option>
          <option value="BBA">BBA</option>
          <option value="BCA">BCA</option>
          <option value="others">Others</option>
        </select>
        <div class="error" id="deptError">Please select your Department</div>
      </div>
      
      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("teacherForm");

    form.addEventListener("submit", function(event) {
      event.preventDefault(); // stop form from submitting by default

      let valid = true;

      // Teacher ID check
      const idField = document.getElementById("id");
      const idError = document.getElementById("idError");
      if (idField.value.trim() === "") {
        idError.style.display = "block";
        valid = false;
      } else {
        idError.style.display = "none";
      }

      // Name check
      const nameField = document.getElementById("name");
      const nameError = document.getElementById("nameError");
      if (nameField.value.trim() === "") {
        nameError.style.display = "block";
        valid = false;
      } else {
        nameError.style.display = "none";
      }

      // Department check
      const deptField = document.getElementById("department");
      const deptError = document.getElementById("deptError");
      if (deptField.value === "") {
        deptError.style.display = "block";
        valid = false;
      } else {
        deptError.style.display = "none";
      }

      // If everything is valid → go to next page
      if (valid) {
        window.location.href = "student_books.html";
      }
    });
  </script>

</body>
</html>
