<!DOCTYPE html>
<html>
<head>
    <title>Admin Registration - BCET Library</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #dfe8df;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .registration-form {
            background-color: #dfe8df;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 5px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        input[type="submit"] {
            width: 100%;
            padding: 15px;
            background-color: #8000ff;
            border: none;
            color: white;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }
        input[type="submit"]:hover {
            background-color: #6600cc;
        }
        .error {
            color: red;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="registration-form">
        <h2>Admin Sign Up</h2>
        <form onsubmit="return validateForm()">
            <input type="text" id="teacher_id" placeholder="Teacher ID">
            <div id="teacherIdError" class="error"></div>

            <input type="text" id="name" placeholder="Full Name">
            <div id="nameError" class="error"></div>

            <input type="password" id="password" placeholder="Password">
            <div id="passwordError" class="error"></div>

            <input type="submit" value="Sign Up">
            <div id="formError" class="error"></div>
        </form>
    </div>

    <script>
        function validateForm() {
            // Clear old errors
            document.getElementById("teacherIdError").innerText = "";
            document.getElementById("nameError").innerText = "";
            document.getElementById("passwordError").innerText = "";
            document.getElementById("formError").innerText = "";

            let teacherId = document.getElementById("teacher_id").value.trim();
            let name = document.getElementById("name").value.trim();
            let password = document.getElementById("password").value.trim();
            let valid = true;

            if (teacherId === "") {
                document.getElementById("teacherIdError").innerText = "Teacher ID is required!";
                valid = false;
            }
            if (name === "") {
                document.getElementById("nameError").innerText = "Full Name is required!";
                valid = false;
            }
            if (password === "") {
                document.getElementById("passwordError").innerText = "Password is required!";
                valid = false;
            }

            if (!valid) {
                document.getElementById("formError").innerText = "⚠️ Please fix the errors above.";
                return false;
            }

            // If all ok
            alert("✅ Your registration is successful!");
            window.location.href = "Library_management_ststem.html";
            return false;
        }
    </script>
</body>
</html>
