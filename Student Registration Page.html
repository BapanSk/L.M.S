<!-- student_registration.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration - BCET Library</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #dfe8df;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .registration-form {
            background-color: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 5px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        input[type="submit"] {
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            border: none;
            color: white;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="registration-form">
        <h2> Student Sign Up</h2>
        <form onsubmit="return validateForm()">
            <input type="text" id="college_id" placeholder="College ID">
            <div id="collegeIdError" class="error"></div>

            <input type="text" id="name" placeholder="Full Name">
            <div id="nameError" class="error"></div>

            <input type="text" id="username" placeholder="Create Username">
            <div id="usernameError" class="error"></div>

            <input type="password" id="password" placeholder="Password">
            <div id="passwordError" class="error"></div>

            <input type="submit" value="Sign Up">
            <div id="formError" class="error"></div>
        </form>
    </div>

    <script>
        function validateForm() {
            // Clear old errors
            document.getElementById("collegeIdError").innerText = "";
            document.getElementById("nameError").innerText = "";
            document.getElementById("usernameError").innerText = "";
            document.getElementById("passwordError").innerText = "";
            document.getElementById("formError").innerText = "";

            let collegeId = document.getElementById("college_id").value.trim();
            let name = document.getElementById("name").value.trim();
            let username = document.getElementById("username").value.trim();
            let password = document.getElementById("password").value.trim();
            let valid = true;

            if (collegeId === "") {
                document.getElementById("collegeIdError").innerText = "College ID is required!";
                valid = false;
            }
            if (name === "") {
                document.getElementById("nameError").innerText = "Full Name is required!";
                valid = false;
            }
            if (username === "") {
                document.getElementById("usernameError").innerText = "Username is required!";
                valid = false;
            }
            if (password === "") {
                document.getElementById("passwordError").innerText = "Password is required!";
                valid = false;
            }

            if (!valid) {
                document.getElementById("formError").innerText = "⚠️ Please fix the errors above.";
                return false;
            }

            // If all ok
            alert("✅ Your registration is successful!");
            window.location.href = "Library_management_ststem.html";
            return false;
        }
    </script>
</body>
</html>
