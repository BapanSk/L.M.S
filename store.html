<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile - BCET Library</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #dfe8df;
      margin: 0;
      padding: 0;
    }
    header {
      background: #3f51b5;
      color: #fff;
      padding: 15px 30px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    .profile-container {
      max-width: 600px;
      margin: 50px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }
    .profile-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    .profile-info {
      font-size: 16px;
      line-height: 1.8;
      color: #444;
    }
    .profile-info strong {
      display: inline-block;
      width: 140px;
      color: #3f51b5;
    }
    .logout-btn {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      background: #100dc4;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .logout-btn:hover {
      background: #c70cd8;
    }
    
  </style>
</head>
<body>

  <header>
    BCET Library - Student Profile
  </header>

  <div class="profile-container">
    <h2>Welcome Student</h2>
    <label for="year">Choose Your Year: </label><br>
    <div class="profile-info">
      <select name="Details" id="Details" >
        
        <option value="year">1st year</option>
        <option value="year">2nd year</option>
        <option value="year">3rd year</option>
        <option value="year">4th year</option>
      </select><br>
      <label for="year">Depeartment: </label><br>
    <div class="profile-info">
      <select name="Details" id="Details" >
        
        <option value="year">CSE</option>
        <option value="year">IT</option>
        <option value="year">ECE</option>
        <option value="year">CS</option>
        <option value="year">ME</option>
        <option value="year">CIVIL</option>
        <option value="year">CS</option>
        <option value="year">MBA</option>
        <option value="year">BBA</option>
        <option value="year">BCA</option>
        <option value="year">others</option>
      </select><br>
      <label for="year">Semeste: </label><br>
    <div class="profile-info">
      <select name="Details" id="Details" >
        
        <option value="year">1st sem</option>
        <option value="year">2nd sem</option>
        <option value="year">3rd sem</option>
        <option value="year">4th sem</option>
        <option value="year">5th sem</option>
        <option value="year">6th sem</option>
        <option value="year">7th sem</option>
        <option value="year">8th sem</option>
      </select>
    </div>
    <button class="logout-btn"onclick="location.href='student_books.html'" >submit</button>
    
  </div>

</body>
</html>




// modify student profile


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile - BCET Library</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #889dd9, #a8e5cf);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .profile-card {
      background: #e6e9eb;
      width: 450px;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0px 6px 20px rgba(0,0,0,0.15);
      text-align: center;
    }

    .profile-card h2 {
      margin-bottom: 25px;
      font-size: 24px;
      color: #333;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      font-size: 15px;
      font-weight: bold;
      color: #444;
      display: block;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
      outline: none;
      transition: border 0.3s;
    }

    select:focus {
      border: 1px solid #4e73df;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      background: #4e73df;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .submit-btn:hover {
      background: #2e59d9;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <h2>📘 Student Profile</h2>

    <div class="form-group">
      <label for="year">Choose Your Year</label>
      <select id="year">
        <option value="1st year">1st Year</option>
        <option value="2nd year">2nd Year</option>
        <option value="3rd year">3rd Year</option>
        <option value="4th year">4th Year</option>
      </select>
    </div>

    <div class="form-group">
      <label for="department">Department</label>
      <select id="department">
        <option value="CSE">CSE</option>
        <option value="IT">IT</option>
        <option value="ECE">ECE</option>
        <option value="ME">ME</option>
        <option value="CIVIL">CIVIL</option>
        <option value="CS">CS</option>
        <option value="MBA">MBA</option>
        <option value="BBA">BBA</option>
        <option value="BCA">BCA</option>
        <option value="Others">Others</option>
      </select>
    </div>

    <div class="form-group">
      <label for="semester">Semester</label>
      <select id="semester">
        <option value="1st sem">1st Sem</option>
        <option value="2nd sem">2nd Sem</option>
        <option value="3rd sem">3rd Sem</option>
        <option value="4th sem">4th Sem</option>
        <option value="5th sem">5th Sem</option>
        <option value="6th sem">6th Sem</option>
        <option value="7th sem">7th Sem</option>
        <option value="8th sem">8th Sem</option>
      </select>
    </div>

    <button class="submit-btn" onclick="location.href='student_books.html'">Submit</button>
  </div>

</body>
</html>
